<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📊 Dashboard - Scheduler</title>

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f9fafc;
  margin: 0;
  padding: 0;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #1f2937;
  color: white;
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  transition: width 0.3s ease;
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}
.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #60a5fa;
  font-size: 1.3rem;
  white-space: nowrap;
}
.sidebar a {
  padding: 12px 20px;
  text-decoration: none;
  color: #d1d5db;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}
.sidebar a:hover, .sidebar a.active {
  background: #374151;
  color: #ffffff;
  cursor: pointer;
}
.sidebar button {
  margin: auto 20px 20px 20px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: #ef4444;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

/* Toggle button */
.toggle-btn {
  position: absolute;
  top: 15px;
  left: 230px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 0 6px 6px 0;
  padding: 8px 12px;
  cursor: pointer;
  z-index: 101;
  transition: left 0.3s ease;
}

/* Collapsed sidebar */
.sidebar.collapsed {
  width: 60px;
}
.sidebar.collapsed h2,
.sidebar.collapsed a span,
.sidebar.collapsed button span {
  display: none;
}
.sidebar.collapsed a {
  justify-content: center;
  padding: 15px 0;
}
.sidebar.collapsed button {
  margin: auto 10px 20px 10px;
  padding: 10px;
}

/* Adjust toggle button when collapsed */
.sidebar.collapsed + .toggle-btn {
  left: 60px;
}

/* Main Content */
.main {
  flex: 1;
  padding: 20px 30px;
  overflow-y: auto;
  transition: all 0.3s ease;
}

.main h1 {
  margin-top: 0;
  color: #111827;
}

/* Summary cards */
.summary {
  display: flex;
  gap: 20px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}
.card {
  flex: 1;
  min-width: 160px;
  background: #fff;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border: 1px solid #e5e7eb;
}
.card h2 {
  margin: 0;
  font-size: 2.2em;
  color: #4f46e5;
}
.card p {
  margin: 5px 0 0 0;
  color: #6b7280;
  font-size: 0.9em;
  font-weight: 600;
}

/* Calendar */
#calendar {
  max-width: 100%;
  margin: 20px 0 30px 0;
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border: 1px solid #e5e7eb;
  min-height: 550px;
}

/* Job cards */
#jobList {
  margin-top: 15px;
}
.job {
  background: #fff;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.job-info {
  line-height: 1.5;
}
.job-method {
  display: inline-block;
  padding: 2px 8px;
  font-size: 0.75rem;
  font-weight: bold;
  border-radius: 4px;
  text-transform: uppercase;
  background: #e0e7ff;
  color: #3730a3;
  margin-bottom: 4px;
}
.job button {
  background: #4f46e5;
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.job button:hover {
  background: #4338ca;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal-content {
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.modal-content h3 {
  margin-top: 0;
  color: #111827;
}
.modal-content label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: #374151;
  margin-bottom: 4px;
}
.modal-content input, .modal-content textarea {
  width: 100%;
  margin-bottom: 14px;
  padding: 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  box-sizing: border-box;
  font-family: inherit;
}
.modal-actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}
.btn-save {
  background: #4f46e5;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.btn-cancel-job {
  background: #ef4444;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.btn-close {
  background: #9ca3af;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>Scheduler</h2>
  <a href="/" class="active"><span>📊 Dashboard</span></a>
  <a href="/schedule"><span>⏰ Schedule</span></a>
  <button id="logoutBtn"><span>Logout</span></button>
</div>

<!-- Toggle Button -->
<button class="toggle-btn" id="toggleSidebar">☰</button>

<!-- Main content -->
<div class="main" id="main">
  <h1>📊 Dashboard</h1>

  <!-- Summary Cards -->
  <div class="summary">
    <div class="card">
      <h2 id="emailCount">0</h2>
      <p>EMAILS SCHEDULED</p>
    </div>
    <div class="card">
      <h2 id="smsCount">0</h2>
      <p>SMS SCHEDULED</p>
    </div>
    <div class="card">
      <h2 id="whatsappCount">0</h2>
      <p>WHATSAPP SCHEDULED</p>
    </div>
  </div>

  <!-- Calendar -->
  <h2>📅 Calendar Overview</h2>
  <div id="calendar"></div>

  <!-- Job List -->
  <h2>📋 Scheduled Queue</h2>
  <div id="jobList"></div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Scheduled Notification</h3>
    
    <label for="editTo">Recipient</label>
    <input type="text" id="editTo" placeholder="Recipient (Email or Phone)"/>
    
    <label for="editDatetime">Date & Time</label>
    <input type="datetime-local" id="editDatetime"/>
    
    <label for="editSubject" id="subjectLabel">Subject</label>
    <input type="text" id="editSubject" placeholder="Subject line"/>
    
    <label for="editBody">Message Body</label>
    <textarea id="editBody" rows="4" placeholder="Message content"></textarea>
    
    <div class="modal-actions">
      <div>
        <button class="btn-save" id="saveJobBtn">Save Changes</button>
        <button class="btn-cancel-job" id="cancelJobBtn">Cancel Notification</button>
      </div>
      <button class="btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcNhqW9wkLs3S7O5bp4GMJ0SWJ4d-7GRo",
  authDomain: "email-scheduler-80501.firebaseapp.com",
  projectId: "email-scheduler-80501",
  storageBucket: "email-scheduler-80501.appspot.com",
  messagingSenderId: "357118084169",
  appId: "1:357118084169:web:1140c0a3f67f0e9bdfeb98",
  measurementId: "G-96971SLQXH"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let jobs = [];
let calendar;
let editingJobId = null;

// Convert ISO string to format suitable for <input type="datetime-local">
function formatForDateTimeInput(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  const pad = (n) => (n < 10 ? "0" + n : n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Fetch jobs from backend
async function fetchJobs() {
  try {
    const user = auth.currentUser;
    if (!user) return;
    
    const token = await user.getIdToken();
    const res = await fetch("/api/jobs", {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    jobs = data.jobs || [];

    document.getElementById("emailCount").innerText = data.counts?.email ?? 0;
    document.getElementById("smsCount").innerText = data.counts?.sms ?? 0;
    document.getElementById("whatsappCount").innerText = data.counts?.whatsapp ?? 0;

    renderCalendar();
    renderJobList();
  } catch (err) {
    console.error("Error fetching jobs:", err);
  }
}

// Render FullCalendar
function renderCalendar() {
  const events = jobs
    .filter(job => job.status === "scheduled")
    .map(job => {
      let icon = "📧 ";
      if (job.method === "sms") icon = "📱 ";
      if (job.method === "whatsapp") icon = "💬 ";
      
      return {
        id: job._id,
        title: `${icon} ${job.subject || job.body || job.to}`,
        start: job.datetime
      };
    });

  if (!calendar) {
    calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
      initialView: "dayGridMonth",
      events,
      eventClick: (info) => openEditModal(info.event.id)
    });
    calendar.render();
  } else {
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  }
}

// Render Job List
function renderJobList() {
  const list = document.getElementById("jobList");
  list.innerHTML = "";
  
  const scheduledJobs = jobs.filter(j => j.status === "scheduled");
  if (scheduledJobs.length === 0) {
    list.innerHTML = "<p style='color:#6b7280;'>No upcoming notifications scheduled.</p>";
    return;
  }

  scheduledJobs.forEach(job => {
    const div = document.createElement("div");
    div.className = "job";
    div.innerHTML = `
      <div class="job-info">
        <span class="job-method">${job.method}</span><br/>
        <strong>To:</strong> ${job.to}<br/>
        <strong>Time:</strong> ${new Date(job.datetime).toLocaleString()}<br/>
        ${job.subject ? `<strong>Subject:</strong> ${job.subject}<br/>` : ""}
        <strong>Message:</strong> ${job.body || ""}
      </div>
      <button onclick="openEditModal('${job._id}')">Edit</button>
    `;
    list.appendChild(div);
  });
}

// Open Edit Modal
window.openEditModal = function(id) {
  const job = jobs.find(j => j._id === id);
  if (!job) return;
  
  editingJobId = id;
  document.getElementById("editTo").value = job.to || "";
  document.getElementById("editDatetime").value = formatForDateTimeInput(job.datetime);
  document.getElementById("editBody").value = job.body || "";
  
  const subjectInput = document.getElementById("editSubject");
  const subjectLabel = document.getElementById("subjectLabel");
  
  if (job.method === "email") {
    subjectInput.style.display = "block";
    subjectLabel.style.display = "block";
    subjectInput.value = job.subject || "";
  } else {
    subjectInput.style.display = "none";
    subjectLabel.style.display = "none";
  }

  document.getElementById("editModal").style.display = "flex";
};

window.closeModal = function() {
  document.getElementById("editModal").style.display = "none";
  editingJobId = null;
};

// Save edited job
document.getElementById("saveJobBtn").addEventListener("click", async () => {
  if (!editingJobId) return;
  
  const payload = {
    to: document.getElementById("editTo").value,
    datetime: document.getElementById("editDatetime").value,
    subject: document.getElementById("editSubject").value,
    body: document.getElementById("editBody").value,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };

  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(`/api/jobs/${editingJobId}`, {
      method: "PUT",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (res.ok) {
      alert("✅ Job updated successfully");
      closeModal();
      fetchJobs();
    } else {
      alert("❌ " + (result.error || "Failed to update"));
    }
  } catch (err) {
    alert("❌ Error: " + err.message);
  }
});

// Cancel Job
document.getElementById("cancelJobBtn").addEventListener("click", async () => {
  if (!editingJobId) return;
  if (!confirm("Are you sure you want to cancel this scheduled notification?")) return;

  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(`/api/jobs/${editingJobId}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` }
    });
    const result = await res.json();
    if (res.ok) {
      alert("✅ Job cancelled successfully");
      closeModal();
      fetchJobs();
    } else {
      alert("❌ " + (result.error || "Failed to cancel job"));
    }
  } catch (err) {
    alert("❌ Error: " + err.message);
  }
});

// Auth observer
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/";
  } else {
    fetchJobs();
  }
});

// Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "/";
});

// Sidebar Toggle
document.getElementById('toggleSidebar').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  setTimeout(() => {
    if (calendar) calendar.updateSize();
  }, 300);
});
</script>
</body>
</html>
